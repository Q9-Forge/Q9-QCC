# Exercise the driver's C89 config parser without scanf-family support.
[global]
target = OS9-68K
frontend = c

[target.OS9-68K]
cpu = 68020
backend = config-test-backend
optimizer = config-test-optimizer
assembler = config-test-assembler
linker = config-test-linker
startup = config-test-startup.r
libraries = config-test.l
qcpp = config-test-qcpp
qcir = config-test-qcir
