# Example qmake toolchain profile. Copy this file and fill in real tool values.
# Target profiles are planned under $Q9SDK/Q9/<architecture>/SYS.
# Host tools are planned under $Q9SDK/<host>/CMDS.
# The Q9 emulator build will use /dd/SYS instead.
# These variables are defaults; project assignments, environment, and -D may
# override them.

# Compiler path or wrapper command (e.g. native QCC, XCC/Wine wrapper).
TARGET_CC =
TARGET_CPPFLAGS =
TARGET_CFLAGS =
# Optional command overrides. @SOURCE@ and @TARGET@ are substituted by qmake.
C_TO_R_COMMAND =

# Optional separate assembler/optimizer/linker tools.
TARGET_AS =
TARGET_ASFLAGS =
ASM_TO_R_COMMAND =
TARGET_OPT =
TARGET_OPTFLAGS =
TARGET_LD =
TARGET_LDFLAGS =

# Target/runtime metadata used by project recipes.
TARGET_CPU =
TARGET_ABI =
DEFS =
LIBS =
STARTUP =
