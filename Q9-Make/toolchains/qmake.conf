# Shared toolchain configuration. Add one section for each compiler/target
# combination; the section name must match the q9makefile configuration name.

[global]
# Values shared by configurations may be placed here.

[mac-clang]
HOST_CC = clang
HOST_CFLAGS = -std=c89

[linux-gcc]
HOST_CC = gcc
HOST_CFLAGS = -std=c89

[windows-clang]
HOST_CC = clang
HOST_CFLAGS = -std=c89

[q9-qcc-68k]
TARGET_ARCH = 68k
TARGET_CPU = 68000
TARGET_CC = qcc
TARGET_CFLAGS = --no-optimizer
DEFS = /dd/DEFS/Q9
LIBS = /dd/LIBS/Q9

# XCC target profiles will be added once its host executable and command-line
# invocation are verified for each development platform.
