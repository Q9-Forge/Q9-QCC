# Shared toolchain configuration. Add one section for each compiler/target
# combination; the section name must match the q9makefile configuration name.

[global]
# Values shared by configurations may be placed here.

[mac-clang]
HOST_PLATFORM = macos
HOST_ARCH = arm64
HOST_CC = clang
HOST_CFLAGS = -std=c89
HOST_OUTPUT_DIR = $(Q9SDK)/macOS/ARM64/CMDS

[mac-clang-x86_64]
HOST_PLATFORM = macos
HOST_ARCH = x86_64
HOST_CC = clang
HOST_CFLAGS = -std=c89 -O2 -Wall -Wextra -arch x86_64 -mmacosx-version-min=$(MACOSX_DEPLOYMENT_TARGET)
MACOSX_DEPLOYMENT_TARGET = 10.13
HOST_OUTPUT_DIR = $(Q9SDK)/macOS/x86_64/CMDS

[mac-xcc-68k]
HOST_PLATFORM = macos
HOST_ARCH = arm64
HOST_OUTPUT_DIR = $(Q9SDK)/macOS/ARM64/CMDS
MWOS_ROOT = /Volumes/SSD1TB/projects/MWOS
TARGET_ARCH = 68k
TARGET_CPU = 68030
TARGET_CC = xcc
TARGET_ABI = os9
TARGET_CFLAGS = -tp=68030,ld
TARGET_OUTPUT_DIR = $(Q9SDK)/Q9/68k/CMDS_XCC
DEFS = /Volumes/SSD1TB/projects/MWOS/SRC/DEFS
LIBS = /Volumes/SSD1TB/projects/MWOS/OS9/68020/LIB

[mac-xqcc-68k]
HOST_PLATFORM = macos
HOST_ARCH = arm64
HOST_OUTPUT_DIR = $(Q9SDK)/macOS/ARM64/CMDS
HOST_CC = clang
HOST_CFLAGS = -std=c89 -O2 -Wall -Wextra -Wno-builtin-requires-header
TARGET_ARCH = 68k
TARGET_CPU = 68000
TARGET_CC = $(Q9SDK)/macOS/ARM64/CMDS/qcc
TARGET_ABI = os9
TARGET_CFLAGS = --no-optimizer
TARGET_OUTPUT_DIR = $(Q9SDK)/Q9/68k/CMDS_XQCC
DEFS = $(Q9SDK)/Q9/68k/DEFS
LIBS = $(Q9SDK)/Q9/68k/LIBS

[linux-gcc]
HOST_PLATFORM = linux
HOST_CC = gcc
HOST_CFLAGS = -std=c89

[windows-clang]
HOST_PLATFORM = windows
HOST_CC = clang
HOST_CFLAGS = -std=c89

[q9-qcc-68k]
HOST_PLATFORM = q9
TARGET_ARCH = 68k
TARGET_CPU = 68000
TARGET_CC = qcc
TARGET_CFLAGS = --no-optimizer
TARGET_OUTPUT_DIR = /dd/CMDS_QCC
DEFS = /dd/DEFS/Q9
LIBS = /dd/LIBS/Q9

[q9-microware-cc-68k]
HOST_PLATFORM = q9
TARGET_ARCH = 68k
TARGET_CPU = 68000
TARGET_CC = cc
TARGET_ABI = os9
TARGET_CFLAGS =
TARGET_OUTPUT_DIR = /dd/CMDS_CC
DEFS = /dd/DEFS
LIBS = /dd/LIB
# ISO-to-K&R source conversion is not yet validated or wired into qmake.
SOURCE_CONVERTER = iso2kr

# mac-xcc-68k is the Mac/Wine XCC cross-build profile; its component wrapper
# uses the verified Microware environment and linker options.
